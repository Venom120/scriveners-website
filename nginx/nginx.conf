server {
    listen 80;

    # The root directory where your React app's static files are located
    root /usr/share/nginx/html;

    # Handle static asset files with proper caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Handle other static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # This is the crucial part
    location / {
        # First, try to serve the requested file ($uri)
        # If it's a directory, try to serve a file named index.html inside it ($uri/)
        # If neither of those work, fall back to serving /index.html
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
    }
}